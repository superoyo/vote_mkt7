<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Dashboard | Marketing 7</title>
<style>
  :root {
    --bg: #07070b;
    --surface: #101019;
    --surface-2: #181826;
    --line: #26263a;
    --ink: #ececf5;
    --muted: #8a8aa0;
    --accent: #a855f7;
    --accent-2: #e879f9;
    --cyan: #22d3ee;
    --live: #34d399;
    --glow: rgba(168, 85, 247, 0.5);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, "Segoe UI", "Helvetica Neue", "Sarabun", Tahoma, sans-serif;
    background:
      radial-gradient(800px circle at 0% 0%, rgba(168, 85, 247, 0.14), transparent 50%),
      radial-gradient(700px circle at 100% 0%, rgba(34, 211, 238, 0.08), transparent 45%),
      var(--bg);
    color: var(--ink);
    min-height: 100vh;
  }
  header {
    padding: 20px 32px;
    border-bottom: 1px solid var(--line);
    background: rgba(16, 16, 25, 0.7);
    backdrop-filter: blur(8px);
    display: flex; align-items: center; justify-content: space-between;
    flex-wrap: wrap; gap: 12px;
    position: sticky; top: 0; z-index: 10;
  }
  header .title .tag { font-size: 11px; letter-spacing: 2px; text-transform: uppercase; color: var(--accent-2); }
  header .title h1 {
    font-size: 20px; margin-top: 2px;
    background: linear-gradient(100deg, #fff, #c9b6ff);
    -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent;
  }
  header .actions { display: flex; align-items: center; gap: 14px; }
  .live {
    display: flex; align-items: center; gap: 7px;
    font-size: 12px; color: var(--muted);
  }
  .live .dot {
    width: 8px; height: 8px; border-radius: 50%;
    background: var(--live);
    box-shadow: 0 0 0 0 rgba(52, 211, 153, 0.6);
    animation: pulse 2s infinite;
  }
  @keyframes pulse {
    0%   { box-shadow: 0 0 0 0 rgba(52, 211, 153, 0.55); }
    70%  { box-shadow: 0 0 0 8px rgba(52, 211, 153, 0); }
    100% { box-shadow: 0 0 0 0 rgba(52, 211, 153, 0); }
  }
  .btn-logout {
    font-family: inherit; font-size: 13px; font-weight: 600;
    padding: 9px 16px; border-radius: 9px; cursor: pointer; border: none;
    background: linear-gradient(135deg, var(--accent), var(--accent-2));
    color: #fff; box-shadow: 0 8px 22px -10px var(--glow);
  }
  .btn-logout:active { transform: scale(0.97); }
  .wrap { max-width: 1080px; margin: 0 auto; padding: 26px 32px 60px; }

  /* การ์ดจำนวนคนตอบ */
  .hero {
    background: var(--surface); border: 1px solid var(--line);
    border-radius: 18px; padding: 30px 32px;
    box-shadow: 0 20px 50px -30px #000, 0 0 60px -40px var(--glow);
    display: flex; align-items: center; gap: 26px; flex-wrap: wrap;
  }
  .hero .icon {
    width: 64px; height: 64px; flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
    font-size: 30px; border-radius: 18px;
    background: linear-gradient(135deg, var(--accent), var(--accent-2));
    box-shadow: 0 0 38px -6px var(--glow);
  }
  .hero .meta .k { font-size: 13px; color: var(--muted); font-weight: 600; }
  .hero .meta .v {
    font-size: 52px; font-weight: 800; line-height: 1.05; margin-top: 2px;
    background: linear-gradient(120deg, var(--accent-2), var(--cyan));
    -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent;
  }
  .hero .meta .s { font-size: 13px; color: var(--muted); }

  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-top: 22px; }
  @media (max-width: 720px) { .grid2 { grid-template-columns: 1fr; } }
  .panel {
    background: var(--surface); border: 1px solid var(--line);
    border-radius: 16px; padding: 22px 24px;
    box-shadow: 0 20px 50px -30px #000;
  }
  .panel h2 { font-size: 15px; margin-bottom: 18px; }

  .barrow { margin-bottom: 14px; }
  .barrow:last-child { margin-bottom: 0; }
  .barrow .meta { display: flex; justify-content: space-between; font-size: 13px; margin-bottom: 5px; }
  .barrow .meta .name { font-weight: 600; }
  .barrow .meta .cnt { color: var(--muted); }
  .track { background: var(--surface-2); height: 14px; border-radius: 99px; overflow: hidden; }
  .fill {
    height: 100%; border-radius: 99px;
    background: linear-gradient(90deg, var(--accent), var(--accent-2));
    box-shadow: 0 0 14px -2px var(--glow);
    width: 0; transition: width .5s ease;
  }
  .fill.alt { background: linear-gradient(90deg, #0ea5e9, var(--cyan)); box-shadow: 0 0 14px -2px rgba(34,211,238,.5); }

  .gauge-num { font-size: 44px; font-weight: 800; line-height: 1; margin-bottom: 14px; }
  .gauge-num .score {
    background: linear-gradient(120deg, var(--accent-2), var(--cyan));
    -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent;
  }
  .gauge-num em { font-size: 17px; font-style: normal; color: var(--muted); }
  .gauge-track { background: var(--surface-2); height: 16px; border-radius: 99px; overflow: hidden; }
  .gauge-fill {
    height: 100%; width: 0; border-radius: 99px;
    background: linear-gradient(90deg, var(--accent), var(--accent-2));
    box-shadow: 0 0 14px -2px var(--glow);
    transition: width .6s ease;
  }
  .gauge-fill.alt { background: linear-gradient(90deg, #0ea5e9, var(--cyan)); box-shadow: 0 0 14px -2px rgba(34,211,238,.5); }
  .gauge-scale { display: flex; justify-content: space-between; font-size: 11.5px; color: var(--muted); margin-top: 8px; }
</style>
</head>
<body>
<header>
  <div class="title">
    <div class="tag">Marketing 7 · Backend</div>
    <h1>Dashboard ผลแบบสอบถาม</h1>
  </div>
  <div class="actions">
    <div class="live"><span class="dot"></span><span id="liveText">กำลังเชื่อมต่อ...</span></div>
    <button class="btn-logout" id="btnLogout">ออกจากระบบ</button>
  </div>
</header>

<div class="wrap">
  <div class="hero">
    <div class="icon">&#128101;</div>
    <div class="meta">
      <div class="k">จำนวนคนตอบทั้งหมด</div>
      <div class="v" id="cTotal">0</div>
      <div class="s">รายการ</div>
    </div>
  </div>

  <div class="grid2">
    <div class="panel">
      <h2>จำแนกตามกลุ่มเป้าหมาย</h2>
      <div id="audChart"></div>
    </div>
    <div class="panel">
      <h2>จำแนกตามกลยุทธ์</h2>
      <div id="strChart"></div>
    </div>
  </div>

  <div class="grid2">
    <div class="panel">
      <h2>ความพึงพอใจเนื้อหา (คะแนนเฉลี่ย)</h2>
      <div class="gauge-num"><span class="score" id="avgContent">0</span><em> / 10</em></div>
      <div class="gauge-track"><div class="gauge-fill" id="avgContentFill"></div></div>
      <div class="gauge-scale"><span>1</span><span>10</span></div>
    </div>
    <div class="panel">
      <h2>ความพอใจในด้านสถานที่ (คะแนนเฉลี่ย)</h2>
      <div class="gauge-num"><span class="score" id="avgVenue">0</span><em> / 10</em></div>
      <div class="gauge-track"><div class="gauge-fill alt" id="avgVenueFill"></div></div>
      <div class="gauge-scale"><span>1</span><span>10</span></div>
    </div>
  </div>
</div>

<script>
  const AUD_LABEL = { GenX:'Gen X', GenY:'Gen Y', GenZ:'Gen Z', GenAlpha:'Gen Alpha', GenBeta:'Gen Beta' };
  const REFRESH_MS = 5000;
  let lastSig = null;

  function renderBars(containerId, dataObj, labelMap, alt) {
    const wrap = document.getElementById(containerId);
    wrap.innerHTML = '';
    const entries = Object.entries(dataObj);
    const max = Math.max(1, ...entries.map(([,v]) => v));
    const total = entries.reduce((a,[,v]) => a+v, 0);
    entries.forEach(([k,v]) => {
      const pct = total ? Math.round((v/total)*100) : 0;
      const row = document.createElement('div');
      row.className = 'barrow';
      row.innerHTML =
        '<div class="meta"><span class="name">' + (labelMap[k] || k) + '</span>' +
        '<span class="cnt">' + v + ' คน · ' + pct + '%</span></div>' +
        '<div class="track"><div class="fill' + (alt ? ' alt' : '') + '"></div></div>';
      wrap.appendChild(row);
      requestAnimationFrame(() => {
        row.querySelector('.fill').style.width = ((v/max)*100) + '%';
      });
    });
  }

  function setLiveText() {
    const t = new Date().toLocaleTimeString('th-TH', { hour:'2-digit', minute:'2-digit', second:'2-digit' });
    document.getElementById('liveText').textContent = 'อัปเดตอัตโนมัติ · ล่าสุด ' + t;
  }

  async function load() {
    let data;
    try {
      const res = await fetch('/api/results');
      if (res.status === 401) { location.href = '/login'; return; }
      data = await res.json();
    } catch (e) {
      document.getElementById('liveText').textContent = 'เชื่อมต่อไม่ได้ · กำลังลองใหม่';
      return;
    }
    setLiveText();
    const sig = JSON.stringify(data);
    if (sig === lastSig) return;   // ข้อมูลไม่เปลี่ยน ไม่ต้องวาดใหม่ (กันกราฟกระพริบ)
    lastSig = sig;

    document.getElementById('cTotal').textContent = data.total;
    renderBars('audChart', data.byAudience, AUD_LABEL, false);
    renderBars('strChart', data.byStrategy, {}, true);

    document.getElementById('avgContent').textContent = data.avgContent;
    document.getElementById('avgVenue').textContent = data.avgVenue;
    document.getElementById('avgContentFill').style.width = (data.avgContent / 10 * 100) + '%';
    document.getElementById('avgVenueFill').style.width = (data.avgVenue / 10 * 100) + '%';
  }

  document.getElementById('btnLogout').addEventListener('click', async () => {
    await fetch('/api/logout', { method: 'POST' });
    location.href = '/login';
  });

  load();
  setInterval(() => { if (!document.hidden) load(); }, REFRESH_MS);
  document.addEventListener('visibilitychange', () => { if (!document.hidden) load(); });
</script>
</body>
</html>
